name: Tests et déploiement
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: deploiement
  cancel-in-progress: true
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install playwright && playwright install --with-deps chromium
      - run: sh tester.sh
      - run: mkdir -p dist && cp low-kanta.html dist/index.html && touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
  deploy:
    # Le jeu n'est publié que si tous les tests passent.
    needs: tests
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v4
